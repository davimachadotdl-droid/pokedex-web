<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Pokédex</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<h1>Pokédex</h1>

<form id="pokemon-form">
<input type="text" id="nome" placeholder="Nome (ex: Pikachu)" required>
<input type="text" id="tipo1" placeholder="Tipo 1 (ex: Elétrico)" required>
<input type="text" id="tipo2" placeholder="Tipo 2 (Opcional)">
<input type="url" id="foto" placeholder="Link da Foto (URL)" required>
<div class="botoes">
<button type="submit" id="btn-incluir">Incluir Pokémon</button>
<button type="reset" id="btn-limpar">Limpar Campos</button>
</div>
</form>
<section id="lista-pokemons" class="grid-pokemons"></section>
</main>
<script src="script.js"></script>
</body>
</html>
